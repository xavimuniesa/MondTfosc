  <div class="holiday-tip" id="holiday-tip" role="tooltip" hidden></div>

  <script>
    // Generació del Bisel Negre
    const bezel = document.getElementById('bezel');
    const bezelNumbers = [
      { val: '60', deg: 0 },
      { val: '10', deg: 60 },
      { val: '20', deg: 120 },
      { val: '30', deg: 180 },
      { val: '40', deg: 240 },
      { val: '50', deg: 300 }
    ];

    bezelNumbers.forEach(item => {
      const numDiv = document.createElement('div');
      numDiv.className = 'bezel-num';
      numDiv.style.transform = `rotate(${item.deg}deg)`;

      const anchor = document.createElement('div');
      anchor.className = 'bezel-num-anchor';

      const innerSpan = document.createElement('span');
      innerSpan.className = 'bezel-num-inner';
      innerSpan.innerText = item.val;
      // Els números són perpendiculars a l'eix (orientació radial), llevat del "30" que es llegeix del dret
      innerSpan.style.transform = item.val === '30' ? `rotate(${-item.deg}deg)` : 'none';

      anchor.appendChild(innerSpan);
      numDiv.appendChild(anchor);
      bezel.appendChild(numDiv);
    });

    const bezelDashes = [30, 90, 150, 210, 270, 330];
    bezelDashes.forEach(deg => {
      const dashDiv = document.createElement('div');
      dashDiv.className = 'bezel-dash';
      dashDiv.style.transform = `rotate(${deg}deg)`;
      bezel.appendChild(dashDiv);
    });

    // Generar ratlles de la minutera (60 divisions), confinades a la banda exterior
    const ticksContainer = document.getElementById('minute-ticks');
    for (let i = 0; i < 60; i++) {
      if (i % 5 !== 0) {
        const tick = document.createElement('div');
        tick.className = 'tick';
        tick.style.transform = `rotate(${i * 6}deg)`;
        ticksContainer.appendChild(tick);
      }
    }

    // Generar els 12 índexs horaris
    const indicesContainer = document.getElementById('indices');
    for (let i = 0; i < 12; i++) {
      const index = document.createElement('div');
      index.className = 'hour-index';
      index.style.transform = `rotate(${i * 30}deg)`;
      indicesContainer.appendChild(index);
    }

    // Generar text arquejat lletra a lletra
    function buildArcText(text, containerId, startAngle, stepAngle, direction, reverse) {
      const container = document.getElementById(containerId);
      const chars = text.split('');
      chars.forEach((ch, i) => {
        const idx = reverse ? (chars.length - 1 - i) : i;
        const angle = direction * (startAngle + idx * stepAngle);
        const wrapper = document.createElement('div');
        wrapper.className = 'arc-letter-wrapper';
        wrapper.style.transform = `rotate(${angle}deg)`;
        const letter = document.createElement('span');
        letter.className = 'arc-letter';
        letter.innerText = ch;
        wrapper.appendChild(letter);
        container.appendChild(wrapper);
      });
    }

    buildArcText('SWISS', 'swiss-arc', 7, 2.33, 1, true);
    buildArcText('MADE', 'made-arc', 7, 2.44, -1, false);

    const daysOfWeek = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    function pad2(n) { return String(n).padStart(2, '0'); }
    function isoOf(date) { return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`; }
    function normName(name) {
      return String(name || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
    }

    // ------------------------------------------------------------------
    // Festius: UNA sola font per al calendari i per a les finestretes de
    // data del Tissot i del Mondaine.
    //  1. Dades obertes de la Generalitat (festius estatals i catalans +
    //     festes locals del municipi on ets, per defecte Barcelona).
    //  2. Si l'API falla o encara no ha publicat l'any, càlcul local a
    //     partir de regles fixes i de la data de Pasqua, i es reintenta
    //     al cap d'una hora.
    // ------------------------------------------------------------------
    const HOLIDAYS_CACHE_KEY = 'tissot_holidays_cache_v3';
    const HOLIDAYS_TTL_MS = 24 * 60 * 60 * 1000;   // dades de l'API: refresc diari
    const HOLIDAYS_RETRY_MS = 60 * 60 * 1000;      // reserva local: reintent cada hora
    const DEFAULT_MUNICIPALITY = 'Barcelona';

    let holidayMunicipality = DEFAULT_MUNICIPALITY;
    const holidayMemory = new Map();   // "any|MUNICIPI" -> { dates, local, localMuni }
    const holidayPending = new Map();  // "any|MUNICIPI" -> Promise en curs

    function holidayKey(year, muni) { return `${year}|${normName(muni)}`; }

    function readHolidayCache() {
      try { return JSON.parse(localStorage.getItem(HOLIDAYS_CACHE_KEY)) || {}; }
      catch (e) { return {}; }
    }

    function writeHolidayCache(cache) {
      const limit = Date.now() - 30 * 24 * 60 * 60 * 1000;
      Object.keys(cache).forEach(k => { if (cache[k].expiresAt < limit) delete cache[k]; });
      try { localStorage.setItem(HOLIDAYS_CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
    }

    function easterSunday(year) {
      // Algorisme de Meeus/Jones/Butcher (calendari gregorià)
      const a = year % 19, b = Math.floor(year / 100), c = year % 100;
      const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }

    function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return d; }

    // Festes locals conegudes per al càlcul de reserva (només Barcelona)
    function localMunicipalFallback(year, muni) {
      if (normName(muni) !== normName(DEFAULT_MUNICIPALITY)) return [];
      return [isoOf(addDays(easterSunday(year), 50)), `${year}-09-24`]; // Pasqua Granada, La Mercè
    }

    function computeLocalHolidays(year, muni) {
      const set = new Set();
      [[1, 1], [1, 6], [5, 1], [8, 15], [10, 12], [11, 1], [12, 6], [12, 8], [12, 25], // estatals
       [6, 24], [9, 11], [12, 26]]                                                     // catalans
        .forEach(([m, d]) => set.add(`${year}-${pad2(m)}-${pad2(d)}`));
      const easter = easterSunday(year);
      set.add(isoOf(addDays(easter, -2))); // Divendres Sant
      set.add(isoOf(addDays(easter, 1)));  // Dilluns de Pasqua Florida
      localMunicipalFallback(year, muni).forEach(iso => set.add(iso));
      return set;
    }

    async function fetchJsonArray(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('Resposta inesperada');
      return data;
    }

    function localHolidaysUrl(year, muni) {
      const where = `upper(ajuntament_o_nucli_municipal)='${normName(muni).replace(/'/g, "''")}'`;
      return `https://analisi.transparenciacatalunya.cat/resource/b4eh-r8up.json?any_calendari=${year}&$where=${encodeURIComponent(where)}`;
    }

    // Informació de festius d'un any: dates, quines són festes locals i de quin municipi
    function makeHolidayInfo(dates, local, localMuni) {
      return { dates: new Set(dates), local: new Set(local || []), localMuni: localMuni || holidayMunicipality };
    }

    function localFallbackInfo(year, muni) {
      const local = localMunicipalFallback(year, muni);
      return makeHolidayInfo(computeLocalHolidays(year, muni), local, local.length ? DEFAULT_MUNICIPALITY : muni);
    }

    // Retorna immediatament la millor informació disponible (memòria, caché o càlcul local)
    function getHolidayInfoSync(year) {
      const key = holidayKey(year, holidayMunicipality);
      if (holidayMemory.has(key)) return holidayMemory.get(key);
      const cached = readHolidayCache()[key];
      if (cached) {
        const info = makeHolidayInfo(cached.dates, cached.local, cached.localMuni);
        holidayMemory.set(key, info);
        return info;
      }
      return localFallbackInfo(year, holidayMunicipality);
    }

    function getHolidaysSync(year) { return getHolidayInfoSync(year).dates; }

    function loadHolidays(year) {
      const muni = holidayMunicipality;
      const key = holidayKey(year, muni);
      const cache = readHolidayCache();
      const entry = cache[key];
      if (entry && entry.expiresAt > Date.now()) {
        const info = makeHolidayInfo(entry.dates, entry.local, entry.localMuni);
        holidayMemory.set(key, info);
        return Promise.resolve(info);
      }
      if (holidayPending.has(key)) return holidayPending.get(key);

      const promise = (async () => {
        let info;
        let ttl = HOLIDAYS_TTL_MS;
        try {
          const regionalUrl = `https://analisi.transparenciacatalunya.cat/resource/yf2b-mjr6.json?any_calendari=${year}`;
          const [regional, local] = await Promise.all([
            fetchJsonArray(regionalUrl),
            fetchJsonArray(localHolidaysUrl(year, muni))
          ]);
          if (regional.length === 0) throw new Error(`Calendari ${year} encara no publicat`);
          const dates = new Set();
          regional.forEach(r => { if (r.data) dates.add(r.data.slice(0, 10)); });
          let localRows = local;
          let localMuni = muni;
          // Si el nom del municipi no coincideix amb el de les dades obertes, fem servir Barcelona
          if (localRows.length === 0 && normName(muni) !== normName(DEFAULT_MUNICIPALITY)) {
            localRows = await fetchJsonArray(localHolidaysUrl(year, DEFAULT_MUNICIPALITY));
            localMuni = DEFAULT_MUNICIPALITY;
          }
          let localDates = localRows.filter(r => r.data).map(r => r.data.slice(0, 10));
          if (localDates.length === 0) {
            localDates = localMunicipalFallback(year, localMuni);
          }
          localDates.forEach(iso => dates.add(iso));
          info = makeHolidayInfo(dates, localDates, localMuni);
        } catch (err) {
          console.warn(`Festius ${year}: es fa servir el càlcul local (${err.message})`);
          info = entry ? makeHolidayInfo(entry.dates, entry.local, entry.localMuni) : localFallbackInfo(year, muni);
          ttl = HOLIDAYS_RETRY_MS;
        }
        const fresh = readHolidayCache();
        fresh[key] = {
          dates: Array.from(info.dates), local: Array.from(info.local), localMuni: info.localMuni,
          expiresAt: Date.now() + ttl
        };
        writeHolidayCache(fresh);
        holidayMemory.set(key, info);
        return info;
      })();

      holidayPending.set(key, promise);
      promise.finally(() => holidayPending.delete(key));
      return promise;
    }

    // Noms de les festivitats. Les dades obertes només diuen quins dies són
    // festius, no el nom, així que el nom surt d'aquesta taula.
    const FIXED_HOLIDAY_NAMES = {
      '01-01': "Cap d'Any",
      '01-06': 'Reis',
      '05-01': 'Festa del Treball',
      '06-24': 'Sant Joan',
      '08-15': "L'Assumpció",
      '09-11': 'Diada Nacional de Catalunya',
      '10-12': "Festa Nacional d'Espanya",
      '11-01': 'Tots Sants',
      '12-06': 'Dia de la Constitució',
      '12-08': 'La Immaculada',
      '12-25': 'Nadal',
      '12-26': 'Sant Esteve'
    };
    const LOCAL_HOLIDAY_NAMES = {
      'BARCELONA': { '09-24': 'La Mercè' }
    };

    function holidayName(iso, info) {
      const year = Number(iso.slice(0, 4));
      const mmdd = iso.slice(5);
      const easter = easterSunday(year);
      const easterNames = {
        [isoOf(addDays(easter, -2))]: 'Divendres Sant',
        [isoOf(addDays(easter, 1))]: 'Dilluns de Pasqua Florida',
        [isoOf(addDays(easter, 50))]: 'Dilluns de Pasqua Granada'
      };
      const name = easterNames[iso] || FIXED_HOLIDAY_NAMES[mmdd] ||
        (LOCAL_HOLIDAY_NAMES[normName(info.localMuni)] || {})[mmdd];
      const isLocal = info.local.has(iso);
      if (!name) return isLocal ? `Festa local de ${info.localMuni}` : 'Festiu oficial';
      return isLocal ? `${name} · festa local de ${info.localMuni}` : name;
    }

    // Canvia el municipi dels festius locals (segons la geolocalització)
    function setHolidayMunicipality(name) {
      if (!name || normName(name) === normName(holidayMunicipality)) return;
      holidayMunicipality = name;
      lastDateKey = '';
      renderCalendar();
      loadHolidays(new Date().getFullYear()).then(() => { lastDateKey = ''; });
    }

    // Color de la data a les finestretes: diumenge o festiu en dia feiner,
    // vermell granat; dissabte, verd fosc; dia feiner normal, null.
    function getFestiuColor(now) {
      const dow = now.getDay();
      if (dow === 0) return '#a50044';
      if (dow === 6) return '#1a5c2e';
      if (getHolidaysSync(now.getFullYear()).has(isoOf(now))) return '#a50044';
      return null;
    }

    // ------------------------------------------------------------------
    // Finestretes de dia i data (Tissot i Mondaine): només s'actualitzen
    // quan canvia el dia, no a cada fotograma.
    // ------------------------------------------------------------------
    const tissotDayEl = document.getElementById('day');
    const tissotDateEl = document.getElementById('date');
    const mondaineDayEl = document.getElementById('mondaine-day-abbr');
    const mondaineDateEl = document.getElementById('mondaine-date-num');
    let lastDateKey = '';

    function refreshDateWindows(now) {
      const festiuColor = getFestiuColor(now);
      tissotDayEl.textContent = daysOfWeek[now.getDay()];
      tissotDateEl.textContent = pad2(now.getDate());
      tissotDayEl.style.color = festiuColor || '';
      tissotDateEl.style.color = festiuColor || '';
      mondaineDayEl.textContent = daysOfWeek[now.getDay()];
      mondaineDateEl.textContent = now.getDate();
      mondaineDayEl.setAttribute('fill', festiuColor || '#1c1c1c');
      mondaineDateEl.setAttribute('fill', festiuColor || '#1c1c1c');
    }

    function checkDateChange(now) {
      const key = isoOf(now);
      if (key !== lastDateKey) {
        lastDateKey = key;
        refreshDateWindows(now);
      }
    }

    // ------------------------------------------------------------------
    // Moviment del Tissot. Un automàtic no escombra de manera contínua:
    // la segonera fa petits salts, 8 per segon en un calibre de 28.800
    // alternances/hora.
    // ------------------------------------------------------------------
    const BEATS_PER_SECOND = 8;
    const secondHandEl = document.getElementById('second-hand');
    const minuteHandEl = document.getElementById('minute-hand');
    const hourHandEl = document.getElementById('hour-hand');
    let lastSecondStep = -1;

    function updateWatch() {
      const now = new Date();
      const ms = now.getMilliseconds();
      const step = now.getSeconds() * BEATS_PER_SECOND + Math.floor(ms * BEATS_PER_SECOND / 1000);

      if (step !== lastSecondStep) {
        lastSecondStep = step;
        const seconds = step / BEATS_PER_SECOND;
        const minutes = now.getMinutes() + (now.getSeconds() + ms / 1000) / 60;
        const hours = (now.getHours() % 12) + minutes / 60;
        secondHandEl.style.transform = `rotate(${seconds * 6}deg)`;
        minuteHandEl.style.transform = `rotate(${minutes * 6}deg)`;
        hourHandEl.style.transform = `rotate(${hours * 30}deg)`;
        checkDateChange(now);
      }

      requestAnimationFrame(updateWatch);
    }

    // ------------------------------------------------------------------
    // Calendari mensual
    // ------------------------------------------------------------------
    let calendarMonthOffset = 0;
    let calendarRenderToken = 0;
    let calendarTitleText = '';
    let weatherViewActive = false;
    const monthNames = [
      'Gener', 'Febrer', 'Març', 'Abril', 'Maig', 'Juny',
      'Juliol', 'Agost', 'Setembre', 'Octubre', 'Novembre', 'Desembre'
    ];

    function makeDayCell(text, extraClass) {
      const cell = document.createElement('div');
      cell.className = extraClass ? `calendar-day-cell ${extraClass}` : 'calendar-day-cell';
      cell.textContent = text;
      return cell;
    }

    // Construeix la graella fora del document i la substitueix d'un sol cop.
    // Si mentrestant s'ha demanat un altre mes, aquest render es descarta,
    // així no es poden barrejar ni duplicar caselles.
    async function renderCalendar() {
      const token = ++calendarRenderToken;
      const real = new Date();
      const target = new Date(real.getFullYear(), real.getMonth() + calendarMonthOffset, 1);
      const year = target.getFullYear();
      const month = target.getMonth();
      const isCurrentMonth = year === real.getFullYear() && month === real.getMonth();

      const holidayInfo = await loadHolidays(year);
      if (token !== calendarRenderToken) return;
      hideHolidayTip();

      const frag = document.createDocumentFragment();
      let startingDay = new Date(year, month, 1).getDay() - 1;
      if (startingDay === -1) startingDay = 6;
      const lastDateOfMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthLast = new Date(year, month, 0).getDate();

      // Darrers dies del mes anterior
      for (let i = 0; i < startingDay; i++) {
        frag.appendChild(makeDayCell(prevMonthLast - startingDay + 1 + i, 'other-month'));
      }

      for (let day = 1; day <= lastDateOfMonth; day++) {
        const cell = makeDayCell(day);
        const dow = new Date(year, month, day).getDay();
        if (dow === 0 || dow === 6) cell.classList.add('weekend');
        const iso = `${year}-${pad2(month + 1)}-${pad2(day)}`;
        if (holidayInfo.dates.has(iso)) {
          const name = holidayName(iso, holidayInfo);
          cell.classList.add('holiday');
          cell.dataset.holiday = name;
          cell.setAttribute('aria-label', `${day}: ${name}`);
        }
        if (isCurrentMonth && day === real.getDate()) cell.classList.add('today');
        frag.appendChild(cell);
      }

      // Primers dies del mes següent fins a 42 caselles (6 setmanes fixes)
      for (let i = startingDay + lastDateOfMonth, next = 1; i < 42; i++, next++) {
        frag.appendChild(makeDayCell(next, 'other-month'));
      }

      calendarTitleText = `${monthNames[month]} ${year}`;
      if (!weatherViewActive) document.getElementById('month-year-title').textContent = calendarTitleText;
      document.getElementById('days-container').replaceChildren(frag);
    }

    // ------------------------------------------------------------------
    // Rètol amb el nom del festiu: en passar-hi per damunt amb el ratolí
    // o tocant la casella al mòbil (desapareix sol al cap d'uns segons).
    // ------------------------------------------------------------------
    const holidayTip = document.getElementById('holiday-tip');
    let holidayTipTimer = null;

    function hideHolidayTip() {
      clearTimeout(holidayTipTimer);
      if (holidayTip) holidayTip.hidden = true;
    }

    function showHolidayTip(cell, autoHideMs) {
      clearTimeout(holidayTipTimer);
      holidayTip.textContent = cell.dataset.holiday;
      holidayTip.hidden = false;
      const r = cell.getBoundingClientRect();
      const tipW = holidayTip.offsetWidth;
      const tipH = holidayTip.offsetHeight;
      const centerX = r.left + r.width / 2;
      const x = Math.min(Math.max(centerX, tipW / 2 + 6), window.innerWidth - tipW / 2 - 6);
      const below = r.top < tipH + 14;
      holidayTip.classList.toggle('below', below);
      holidayTip.style.left = `${x}px`;
      holidayTip.style.top = `${below ? r.bottom : r.top}px`;
      holidayTip.style.setProperty('--arrow-x', `${tipW / 2 + (centerX - x)}px`);
      if (autoHideMs) holidayTipTimer = setTimeout(hideHolidayTip, autoHideMs);
    }

    (function setupHolidayTips() {
      const days = document.getElementById('days-container');
      days.addEventListener('mouseover', (e) => {
        const cell = e.target.closest('.holiday');
        if (cell) showHolidayTip(cell);
      });
      days.addEventListener('mouseout', (e) => {
        const cell = e.target.closest('.holiday');
        if (cell && !cell.contains(e.relatedTarget)) hideHolidayTip();
      });
      days.addEventListener('click', (e) => {
        const cell = e.target.closest('.holiday');
        if (cell) showHolidayTip(cell, 2800);
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.holiday')) hideHolidayTip();
      });
      window.addEventListener('resize', hideHolidayTip);
    })();

    // ------------------------------------------------------------------
    // Vista del temps (lliscar el calendari amunt o avall)
    // ------------------------------------------------------------------
    const WEATHER_TITLE = 'El temps ara';
    const ALERT_HOURS = 12;

    const WMO_DESCRIPTIONS = {
      0: 'Cel serè', 1: 'Gairebé serè', 2: 'Parcialment ennuvolat', 3: 'Cobert',
      45: 'Boira', 48: 'Boira gebradora',
      51: 'Plugim feble', 53: 'Plugim', 55: 'Plugim intens', 56: 'Plugim gelat', 57: 'Plugim gelat intens',
      61: 'Pluja feble', 63: 'Pluja', 65: 'Pluja intensa', 66: 'Pluja gelant', 67: 'Pluja gelant intensa',
      71: 'Neu feble', 73: 'Neu', 75: 'Neu intensa', 77: 'Grans de neu',
      80: 'Ruixats febles', 81: 'Ruixats', 82: 'Ruixats molt intensos',
      85: 'Ruixats de neu', 86: 'Ruixats de neu intensos',
      95: 'Tempesta', 96: 'Tempesta amb calamarsa', 99: 'Tempesta amb calamarsa forta'
    };

    // Icones de línia fina, en el mateix estil que el sol i la lluna del botó de tema
    const WX_CLOUD = 'M7 17.5h10a3.6 3.6 0 0 0 .3-7.2 5.2 5.2 0 0 0-10 1.3A3 3 0 0 0 7 17.5z';
    const WX_SUN_FULL = '<g class="wx-sun"><circle cx="12" cy="12" r="4.2"/>' +
      '<path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.55 1.55M17.15 17.15l1.55 1.55M5.3 18.7l1.55-1.55M17.15 6.85l1.55-1.55"/></g>';
    const WX_MOON_FULL = '<path class="wx-sun" d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/>';
    const WX_SUN_SMALL = '<g class="wx-sun"><circle cx="8.5" cy="8" r="3"/>' +
      '<path d="M8.5 2.3v1.3M2.8 8h1.3M4.5 4l.95.95M12.5 4l-.95.95M4.5 12l.95-.95"/></g>';
    const WX_MOON_SMALL = '<path class="wx-sun" d="M12.3 9.6A5 5 0 0 1 6.1 3.4a5 5 0 1 0 6.2 6.2z"/>';

    function cloudPath(dx, dy, filled) {
      const fill = filled ? ' style="fill: var(--bg)"' : '';
      return `<path transform="translate(${dx} ${dy})" d="${WX_CLOUD}"${fill}/>`;
    }

    function weatherIconSvg(code, isDay) {
      let body;
      if (code === 0) body = isDay ? WX_SUN_FULL : WX_MOON_FULL;
      else if (code === 1 || code === 2) body = (isDay ? WX_SUN_SMALL : WX_MOON_SMALL) + cloudPath(1.5, 2.5, true);
      else if (code === 3) body = cloudPath(0, 0);
      else if (code === 45 || code === 48) body = '<path d="M4 8.5h16M6 12.5h12M4 16.5h16" />';
      else if (code >= 51 && code <= 57) body = cloudPath(0, -3) + '<path class="wx-water" d="M8.5 18.5v1M12 19.5v1M15.5 18.5v1"/>';
      else if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) body = cloudPath(0, -3) + '<path class="wx-water" d="M8.5 17.5l-1 3M12 18l-1 3M15.5 17.5l-1 3"/>';
      else if ((code >= 71 && code <= 77) || code === 85 || code === 86) body = cloudPath(0, -3) +
        '<path class="wx-water" d="M8 17.5v3M6.7 19h2.6M12 18.5v3M10.7 20h2.6M16 17.5v3M14.7 19h2.6"/>';
      else if (code >= 95) body = cloudPath(0, -3) + '<path class="wx-bolt" d="M12.8 15.5l-2.3 3.5h3l-2.3 3.5"/>';
      else body = cloudPath(0, 0);
      return `<svg viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
    }

    const ALERT_ICONS = {
      rain: '<svg viewBox="0 0 24 24"><path d="M7 14.5h10a3.6 3.6 0 0 0 .3-7.2 5.2 5.2 0 0 0-10 1.3A3 3 0 0 0 7 14.5z"/><path d="M8.5 17.5l-1 3M12 18l-1 3M15.5 17.5l-1 3"/></svg>',
      storm: '<svg viewBox="0 0 24 24"><path d="M7 14.5h10a3.6 3.6 0 0 0 .3-7.2 5.2 5.2 0 0 0-10 1.3A3 3 0 0 0 7 14.5z"/><path d="M12.8 15.5l-2.3 3.5h3l-2.3 3.5"/></svg>',
      snow: '<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>',
      wind: '<svg viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h8"/></svg>',
      fog: '<svg viewBox="0 0 24 24"><path d="M4 8.5h16M6 12.5h12M4 16.5h16"/></svg>'
    };

    const WIND_DIRS = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
    function windCardinal(deg) { return WIND_DIRS[Math.round(((deg % 360) + 360) % 360 / 45) % 8]; }

    // Avisos calculats a partir de la previsió horària de les properes hores
    // (no són els avisos oficials de Meteocat o AEMET)
    function computeAlerts(weather) {
      const h = weather.hourly;
      if (!h || !h.time) return [];
      const currentHour = (weather.current && weather.current.time ? weather.current.time : '').slice(0, 13);
      let start = h.time.findIndex(t => t.slice(0, 13) >= currentHour);
      if (start < 0) start = 0;
      const end = Math.min(start + ALERT_HOURS, h.time.length);
      const at = (i) => (i === start ? 'ara' : `a les ${Number(h.time[i].slice(11, 13))} h`);
      const val = (arr, i) => (arr && arr[i] != null ? arr[i] : null);
      const found = {};
      for (let i = start; i < end; i++) {
        const code = val(h.weather_code, i);
        const precip = val(h.precipitation, i) || 0;
        const snow = val(h.snowfall, i) || 0;
        const gust = val(h.wind_gusts_10m, i) || 0;
        const vis = val(h.visibility, i);
        if (!found.storm && code >= 95) found.storm = { text: 'Tempesta', when: at(i) };
        if (!found.rain && (precip >= 10 || code === 65 || code === 82)) found.rain = { text: 'Pluja intensa', when: at(i) };
        if (!found.snow && (snow > 0 || (code >= 71 && code <= 77) || code === 85 || code === 86)) found.snow = { text: 'Neu', when: at(i) };
        if (gust >= 60) {
          if (!found.wind) found.wind = { text: 'Vent fort', when: at(i), max: gust };
          else found.wind.max = Math.max(found.wind.max, gust);
        }
        if (!found.fog && (code === 45 || code === 48 || (vis != null && vis < 1000))) found.fog = { text: 'Boira', when: at(i) };
      }
      if (found.wind) found.wind.text = `Ratxes de ${Math.round(found.wind.max)} km/h`;
      return ['storm', 'rain', 'snow', 'wind', 'fog'].filter(k => found[k]).map(k => ({ type: k, ...found[k] }));
    }

    function renderWeatherView(weather) {
      const c = weather.current;
      if (!c) return;
      const code = c.weather_code != null ? c.weather_code : 3;
      const isDay = c.is_day != null ? c.is_day === 1 : autoTheme() === 'day';
      document.getElementById('wx-icon').innerHTML = weatherIconSvg(code, isDay);
      document.getElementById('wx-temp').textContent = `${Math.round(c.temperature_2m)}°`;
      document.getElementById('wx-desc').textContent = WMO_DESCRIPTIONS[code] || '';
      document.getElementById('wx-feels').textContent = `${Math.round(c.apparent_temperature)}°C`;
      document.getElementById('wx-humidity').textContent = `${Math.round(c.relative_humidity_2m)}%`;

      if (c.wind_speed_10m != null) {
        const dir = c.wind_direction_10m || 0;
        const arrow = `<svg class="wind-arrow" viewBox="0 0 24 24" style="transform: rotate(${dir + 180}deg)" aria-hidden="true"><path d="M12 20V4M6 10l6-6 6 6"/></svg>`;
        document.getElementById('wx-wind').innerHTML = `${Math.round(c.wind_speed_10m)} <small>km/h</small>`;
        document.getElementById('wx-gusts').innerHTML =
          `${windCardinal(dir)}${arrow}` + (c.wind_gusts_10m != null ? ` · ratxes ${Math.round(c.wind_gusts_10m)}` : '');
      }

      const alerts = computeAlerts(weather);
      const box = document.getElementById('wx-alerts');
      box.innerHTML = alerts.length
        ? alerts.map(a => `<span class="wx-alert">${ALERT_ICONS[a.type]}${a.text} · ${a.when}</span>`).join('')
        : `<span class="wx-alert none">Sense avisos les properes ${ALERT_HOURS} h</span>`;
    }

    function setWeatherView(active, swipeDir) {
      if (active === weatherViewActive) return;
      weatherViewActive = active;
      hideHolidayTip();
      const views = document.getElementById('cal-views');
      views.style.setProperty('--swipe-dir', swipeDir === 'down' ? 1 : -1);
      views.classList.toggle('show-weather', active);
      document.getElementById('view-weather').setAttribute('aria-hidden', String(!active));
      document.getElementById('view-calendar').setAttribute('aria-hidden', String(active));
      const dots = document.querySelectorAll('#view-dots span');
      dots[0].classList.toggle('on', !active);
      dots[1].classList.toggle('on', active);
      const titleEl = document.getElementById('month-year-title');
      titleEl.textContent = active ? WEATHER_TITLE : calendarTitleText;
      titleEl.classList.toggle('wx-mode', active);
    }

    function toggleWeatherView(swipeDir) { setWeatherView(!weatherViewActive, swipeDir); }

    (function setupWeatherViewControls() {
      document.getElementById('view-dots').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleWeatherView('up');
      });
      // Roda del ratolí o trackpad sobre el calendari
      let wheelLock = 0;
      document.getElementById('cal-views').addEventListener('wheel', (e) => {
        if (Math.abs(e.deltaY) < 25 || Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
        e.preventDefault();
        const now = Date.now();
        if (now < wheelLock) return;
        wheelLock = now + 700;
        if (e.deltaY > 0 && !weatherViewActive) setWeatherView(true, 'up');
        else if (e.deltaY < 0 && weatherViewActive) setWeatherView(false, 'down');
      }, { passive: false });
    })();

    // Anima el pas d'un mes a un altre lliscant els elements del calendari
    // (direction: -1 cap enrere, +1 cap endavant, 0 sense desplaçament lateral)
    function animateToMonth(newOffset, direction) {
      if (newOffset === calendarMonthOffset) return;

      const daysContainer = document.getElementById('days-container');
      const titleEl = document.getElementById('month-year-title');
      const outDistance = direction > 0 ? '-14px' : direction < 0 ? '14px' : '0';
      const inDistance = direction > 0 ? '14px' : direction < 0 ? '-14px' : '0';

      [daysContainer, titleEl].forEach(el => {
        el.style.transition = 'transform 0.16s ease, opacity 0.16s ease';
        el.style.transform = `translateX(${outDistance})`;
        el.style.opacity = '0';
      });

      calendarMonthOffset = newOffset;

      setTimeout(async () => {
        await renderCalendar();
        [daysContainer, titleEl].forEach(el => {
          el.style.transition = 'none';
          el.style.transform = `translateX(${inDistance})`;
          el.style.opacity = '0';
        });
        requestAnimationFrame(() => {
          [daysContainer, titleEl].forEach(el => {
            el.style.transition = 'transform 0.16s ease, opacity 0.16s ease';
            el.style.transform = 'translateX(0)';
            el.style.opacity = '1';
          });
        });
      }, 160);
    }

    // Canvia de mes (direction: -1 mes anterior, +1 mes següent), sense límit
    function shiftCalendarMonth(direction) {
      animateToMonth(calendarMonthOffset + direction, direction);
    }

    // Torna directament al mes actual, des d'on sigui
    function goToCurrentMonth() {
      setWeatherView(false, 'down');
      if (calendarMonthOffset === 0) return;
      const direction = calendarMonthOffset > 0 ? -1 : 1;
      animateToMonth(0, direction);
    }

    // Gestos de lliscament (tàctil i ratolí) sobre el calendari per canviar de mes
    (function setupCalendarSwipe() {
      const swipeTarget = document.querySelector('.calendar-section');
      if (!swipeTarget) return;

      let startX = 0;
      let startY = 0;
      let tracking = false;

      const SWIPE_THRESHOLD = 40;

      function onStart(x, y, target) {
        // La barra d'indicadors té el seu propi lliscament horitzontal natiu;
        // no ha d'engegar mai el canvi de mes del calendari
        if (target && target.closest && target.closest('.data-panel')) {
          tracking = false;
          return;
        }
        startX = x;
        startY = y;
        tracking = true;
      }

      function onEnd(x, y) {
        if (!tracking) return;
        tracking = false;
        const deltaX = x - startX;
        const deltaY = y - startY;
        // Vertical: alterna entre el calendari i la vista del temps
        if (Math.abs(deltaY) >= SWIPE_THRESHOLD && Math.abs(deltaY) > Math.abs(deltaX)) {
          toggleWeatherView(deltaY < 0 ? 'up' : 'down');
          return;
        }
        // Horitzontal: canvia de mes (només a la vista del calendari)
        if (Math.abs(deltaX) < SWIPE_THRESHOLD || weatherViewActive) return;
        shiftCalendarMonth(deltaX < 0 ? 1 : -1);
      }

      swipeTarget.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        onStart(t.clientX, t.clientY, e.target);
      }, { passive: true });

      swipeTarget.addEventListener('touchend', (e) => {
        const t = e.changedTouches[0];
        onEnd(t.clientX, t.clientY);
      }, { passive: true });

      // Suport per a ratolí (arrossegar), útil en escriptori
      swipeTarget.addEventListener('mousedown', (e) => {
        onStart(e.clientX, e.clientY, e.target);
      });

      swipeTarget.addEventListener('mouseup', (e) => {
        onEnd(e.clientX, e.clientY);
      });
    })();

    // Tornar al mes actual: botó "Avui" o doble toc/clic sobre el nom del mes
    (function setupCalendarTodayControls() {
      const todayBtn = document.getElementById('calendar-today-btn');
      const titleEl = document.getElementById('month-year-title');
      if (todayBtn) {
        todayBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          goToCurrentMonth();
        });
      }
      if (titleEl) {
        // Doble clic (ratolí / trackpad)
        titleEl.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          goToCurrentMonth();
        });

        // Doble toc (tàctil): dos touchend consecutius en menys de 350ms i sense moviment
        let lastTapTime = 0;
        let lastTapX = 0;
        let lastTapY = 0;
        titleEl.addEventListener('touchend', (e) => {
          const t = e.changedTouches[0];
          const now = Date.now();
          const dx = Math.abs(t.clientX - lastTapX);
          const dy = Math.abs(t.clientY - lastTapY);
          if (now - lastTapTime < 350 && dx < 25 && dy < 25) {
            e.stopPropagation();
            e.preventDefault();
            goToCurrentMonth();
            lastTapTime = 0;
          } else {
            lastTapTime = now;
            lastTapX = t.clientX;
            lastTapY = t.clientY;
          }
        });
      }
    })();

    // ------------------------------------------------------------------
    // Rellotge Mondaine (cara posterior)
    // ------------------------------------------------------------------

    // Generar les 60 marques de l'esfera Mondaine
    const mondaineTicksContainer = document.getElementById('mondaine-ticks');
    for (let i = 0; i < 60; i++) {
      if (i === 15) continue; // deixem l'espai lliure per a la finestreta de la data (3h)
      const angle = i * 6 * Math.PI / 180;
      const isHour = i % 5 === 0;
      const r1 = isHour ? 72 : 84;
      const w = isHour ? 6 : 3;
      const len = isHour ? 20 : 8;
      const x1 = 100 + r1 * Math.sin(angle), y1 = 100 - r1 * Math.cos(angle);
      const x2 = 100 + (r1 + len) * Math.sin(angle), y2 = 100 - (r1 + len) * Math.cos(angle);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', x1); line.setAttribute('y1', y1);
      line.setAttribute('x2', x2); line.setAttribute('y2', y2);
      line.setAttribute('stroke', '#1c1c1c');
      line.setAttribute('stroke-width', w);
      mondaineTicksContainer.appendChild(line);
    }

    // Moviment en temps real de les agulles del Mondaine, amb l'efecte "stop2go":
    // la segundera arriba a les 12 abans que acabi el minut i hi espera l'impuls
    // exacte del canvi de minut, com als rellotges d'estació suïssos.
    // (La finestreta de data es refresca des de checkDateChange, un cop per dia.)
    const mondaineHourEl = document.getElementById('mondaine-hour-hand');
    const mondaineMinEl = document.getElementById('mondaine-min-hand');
    const mondaineSecEl = document.getElementById('mondaine-sec-group');

    function updateMondaine() {
      const now = new Date();
      const h = now.getHours() % 12;
      const m = now.getMinutes();
      const rawSeconds = now.getSeconds() + now.getMilliseconds() / 1000;

      const sFrac = rawSeconds < 58 ? rawSeconds : 58;
      const sAngle = (sFrac / 58) * 360;
      const mAngle = m * 6;
      const hAngle = (h + m / 60) * 30;

      mondaineHourEl.setAttribute('transform', `rotate(${hAngle} 100 100)`);
      mondaineMinEl.setAttribute('transform', `rotate(${mAngle} 100 100)`);
      mondaineSecEl.setAttribute('transform', `rotate(${sAngle} 100 100)`);

      requestAnimationFrame(updateMondaine);
    }

    // ------------------------------------------------------------------
    // Mecanisme de gir: tocar l'esfera fa girar el rellotge 180°, revelant
    // l'altra cara. Un altre toc el torna a girar, sempre en el mateix
    // sentit de rotació (mai en sentit invers). Ambdues cares segueixen
    // marcant l'hora real durant tot moment.
    // ------------------------------------------------------------------
    (function initWatchFlip() {
      const watchFlip = document.getElementById('watchFlip');

      // Capes fosques intermèdies que omplen el gruix del rellotge,
      // perquè no es vegi transparent de cantell durant el gir.
      const depths = [];
      for (let z = -12; z <= 12; z += 2) depths.push(z);
      depths.forEach(z => {
        const layer = document.createElement('div');
        layer.className = 'watch-edge-layer';
        layer.style.transform = `translateZ(${z}px)`;
        watchFlip.insertBefore(layer, watchFlip.firstChild);
      });

      // Comptador de girs: cada toc suma 180° més, mai es resta,
      // de manera que el gir sempre avança en el mateix sentit.
      let turns = 0;
      watchFlip.addEventListener('click', () => {
        turns += 1;
        watchFlip.style.transform = `rotateY(${turns * 180}deg)`;
      });
    })();

    // ------------------------------------------------------------------
    // Iniciar rellotges i calendari
    // ------------------------------------------------------------------
    renderCalendar();
    loadHolidays(new Date().getFullYear()).then(() => { lastDateKey = ''; });
    setInterval(renderCalendar, 60 * 60 * 1000); // refresc periòdic dels festius

    // Repinta el calendari just després de mitjanit perquè l'anell d'avui canviï de dia a l'hora
    (function scheduleMidnightRefresh() {
      const now = new Date();
      const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 2);
      setTimeout(() => {
        renderCalendar();
        scheduleMidnightRefresh();
      }, nextMidnight - now);
    })();

    requestAnimationFrame(updateWatch);
    requestAnimationFrame(updateMondaine);

    // ------------------------------------------------------------------
    // Tema diürn / nocturn
    //  - Automàtic: segons la sortida i la posta de sol reals del lloc
    //    (Open-Meteo); si encara no se saben, de 7 h a 20 h.
    //  - Botó de 3 estats: automàtic → manual (l'altre tema) → manual
    //    (el tema contrari) → torna a automàtic.
    // ------------------------------------------------------------------
    const THEME_STORAGE_KEY = 'tissot_theme_override'; // 'day' | 'night' | absent = automàtic

    // Icones de línia fina, en la línia gràfica del rellotge
    const SUN_ICON = '<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="4.2"/>' +
      '<path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.55 1.55M17.15 17.15l1.55 1.55M5.3 18.7l1.55-1.55M17.15 6.85l1.55-1.55"/>' +
      '</svg>';
    const MOON_ICON = '<svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z"/>' +
      '</svg>';
    let sunTimes = null; // { sunrise: Date, sunset: Date }

    function getStoredTheme() {
      try {
        const v = localStorage.getItem(THEME_STORAGE_KEY);
        return v === 'day' || v === 'night' ? v : null;
      } catch (e) { return null; }
    }

    function setStoredTheme(v) {
      try {
        if (v) localStorage.setItem(THEME_STORAGE_KEY, v);
        else localStorage.removeItem(THEME_STORAGE_KEY);
      } catch (e) {}
    }

    function autoTheme() {
      const now = new Date();
      if (sunTimes && isoOf(sunTimes.sunrise) === isoOf(now)) {
        return now >= sunTimes.sunrise && now < sunTimes.sunset ? 'day' : 'night';
      }
      const h = now.getHours();
      return h >= 7 && h < 20 ? 'day' : 'night';
    }

    function applyTheme() {
      const stored = getStoredTheme();
      const theme = stored || autoTheme();
      document.documentElement.setAttribute('data-theme', theme);
      const themeMeta = document.getElementById('theme-color-meta');
      if (themeMeta) themeMeta.setAttribute('content', theme === 'day' ? '#e8edf4' : '#0d0d0d');
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.innerHTML = (theme === 'day' ? SUN_ICON : MOON_ICON) + (stored ? '' : '<span class="theme-auto-badge">A</span>');
        btn.title = stored
          ? `Tema ${theme === 'day' ? 'diürn' : 'nocturn'} fix (toca per canviar)`
          : 'Tema automàtic segons el sol (toca per fixar-lo)';
      }
    }

    function cycleTheme() {
      const stored = getStoredTheme();
      const auto = autoTheme();
      if (!stored) setStoredTheme(auto === 'day' ? 'night' : 'day'); // automàtic → l'altre tema
      else if (stored !== auto) setStoredTheme(auto);                // → el tema contrari
      else setStoredTheme(null);                                     // → torna a automàtic
      applyTheme();
    }

    document.getElementById('theme-toggle-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      cycleTheme();
    });

    applyTheme();
    setInterval(applyTheme, 60 * 1000); // en mode automàtic, revisa cada minut

    // ------------------------------------------------------------------
    // Dades ambientals segons coordenades (es refresquen cada 20 minuts)
    // ------------------------------------------------------------------
    const FALLBACK_COORDS = { lat: 41.3874, lon: 2.1686 };
    const WEATHER_REFRESH_MS = 20 * 60 * 1000;
    const PRECIP_HOURS = 6;
    let currentCoords = null;

    async function fetchWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m` +
        `&hourly=precipitation_probability,precipitation,snowfall,weather_code,wind_gusts_10m,visibility` +
        `&daily=sunrise,sunset` +
        `&forecast_days=2&timezone=auto`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Error de meteo');
      return res.json();
    }

    async function fetchElevation(lat, lon) {
      const url = `https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Error d\'altitud');
      return res.json();
    }

    async function fetchLocality(lat, lon) {
      const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ca`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Error de geocodificació');
      return res.json();
    }

    // Probabilitat màxima de precipitació de les properes hores (no de tot el dia),
    // i si en aquest interval es preveu neu
    function precipitationNextHours(weather) {
      const hourly = weather.hourly;
      if (!hourly || !hourly.time || !hourly.precipitation_probability) return null;
      const currentHour = (weather.current && weather.current.time ? weather.current.time : '').slice(0, 13);
      let start = hourly.time.findIndex(t => t.slice(0, 13) >= currentHour);
      if (start < 0) start = 0;
      const end = Math.min(start + PRECIP_HOURS, hourly.time.length);
      let maxProb = 0;
      let snow = 0;
      for (let i = start; i < end; i++) {
        maxProb = Math.max(maxProb, hourly.precipitation_probability[i] || 0);
        snow += (hourly.snowfall && hourly.snowfall[i]) || 0;
      }
      return { prob: Math.round(maxProb), type: snow > 0 ? 'neu' : 'pluja' };
    }

    async function refreshWeather(lat, lon) {
      const weather = await fetchWeather(lat, lon).catch(() => null);
      if (!weather) return;

      if (weather.current) {
        document.getElementById('data-temp').textContent = `${Math.round(weather.current.temperature_2m)}°C`;
        document.getElementById('data-humidity').textContent = `${Math.round(weather.current.relative_humidity_2m)}%`;
        if (weather.current.apparent_temperature !== undefined) {
          document.getElementById('data-feels').textContent = `${Math.round(weather.current.apparent_temperature)}°C`;
        }
      }

      renderWeatherView(weather);

      const precip = precipitationNextHours(weather);
      if (precip) document.getElementById('data-precip').textContent = `${precip.prob}% ${precip.type}`;

      if (weather.daily && weather.daily.sunrise && weather.daily.sunset) {
        sunTimes = { sunrise: new Date(weather.daily.sunrise[0]), sunset: new Date(weather.daily.sunset[0]) };
        applyTheme();
      }
    }

    async function loadInstrumentData(lat, lon) {
      currentCoords = { lat, lon };
      const [, elevation, locality] = await Promise.all([
        refreshWeather(lat, lon),
        fetchElevation(lat, lon).catch(() => null),
        fetchLocality(lat, lon).catch(() => null)
      ]);

      if (elevation && elevation.elevation && elevation.elevation.length) {
        const altitudeText = `${Math.round(elevation.elevation[0])} m`;
        document.getElementById('data-altitude').textContent = altitudeText;
        document.getElementById('wx-altitude').textContent = altitudeText;
        document.getElementById('mondaine-alt-text').textContent = altitudeText;
      }

      if (locality) {
        const placeName = locality.city || locality.locality || locality.principalSubdivision || 'Ubicació desconeguda';
        document.getElementById('data-location').textContent = placeName;
        // Festes locals del municipi on ets (si és a Catalunya)
        const inCatalonia = normName(locality.principalSubdivision).includes('CATALUNYA') ||
                            normName(locality.principalSubdivision).includes('CATALONIA');
        const town = locality.city || locality.locality;
        if (inCatalonia && town) setHolidayMunicipality(town);
      } else {
        document.getElementById('data-location').textContent = 'Ubicació desconeguda';
      }
    }

    function initInstrumentData() {
      if (!navigator.geolocation) {
        loadInstrumentData(FALLBACK_COORDS.lat, FALLBACK_COORDS.lon);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => loadInstrumentData(pos.coords.latitude, pos.coords.longitude),
        () => loadInstrumentData(FALLBACK_COORDS.lat, FALLBACK_COORDS.lon),
        { timeout: 8000 }
      );
    }

    // ------------------------------------------------------------------
    // App instal·lable: service worker (funciona sense connexió) i botó
    // d'instal·lar, que només apareix quan el navegador ho permet.
    // ------------------------------------------------------------------
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker:', err));
      });
    }

    let deferredInstallPrompt = null;
    const installBtn = document.getElementById('install-btn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      installBtn.hidden = false;
    });
    installBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.hidden = true;
    });
    window.addEventListener('appinstalled', () => { installBtn.hidden = true; });

    initInstrumentData();
    setInterval(() => {
      if (currentCoords) refreshWeather(currentCoords.lat, currentCoords.lon);
    }, WEATHER_REFRESH_MS);
  </script>
</body>
</html>
